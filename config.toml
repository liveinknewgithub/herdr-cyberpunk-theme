onboarding = false

# ── Night City palette ──────────────────────────────────────────────────────
# Yellow-on-black, the same palette as the Night City desktop layout: yellow
# #FCEE0A on near-black, cyan for branches, red for blocked. Every UI token is
# overridden, so the base theme only matters if a future Herdr release adds
# new tokens.
[theme]
name = "dracula"
auto_switch = false

[theme.custom]
accent = "#FCEE0A"        # Night City yellow: focused borders, highlights, prompts
panel_bg = "#0C0D11"      # tab bar, popups, modals
sidebar_bg = "#07080A"    # sidebar backdrop
active_row_bg = "#2A2708" # active space / focused agent row
selection_bg = "#4A4410"  # navigate-mode cursor row
surface0 = "#121318"      # subtle surfaces
surface1 = "#1A1B21"      # hover / active surfaces
surface_dim = "#2A2B2F"   # separators, scrollbar tracks
overlay0 = "#5A5B52"      # muted text, unfocused borders
overlay1 = "#9A9B8E"      # secondary text, status bar entries
text = "#F0EEE4"          # primary text
subtext0 = "#B8B6A6"      # unfocused agent names, dim labels
mauve = "#00F0FF"         # cyan: branches, special labels
green = "#5EF38C"         # idle
yellow = "#FCEE0A"        # working
red = "#FF003C"           # blocked / needs attention
blue = "#00F0FF"          # unseen notifications
teal = "#55EAD4"          # done
peach = "#FF7A00"         # interrupted / warnings

[ui]
# Room for the agent logo on the same line as workspace + tab.
sidebar_width = 30
# Shape + color per state: ◐ working, × blocked, ✓ done, ○ idle.
status_indicators = "symbols"
# Frame around every pane; the frame title shows the agent's logo.
pane_borders = "always"
show_agent_labels_on_pane_borders = true
tab_bar_right = [
  { type = "zoom" },
  { type = "text", text = "NIGHT CITY" },
  { type = "text", text = "2077" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " // "

# ── Agent rows: logo glyph instead of the agent's name ──────────────────────
# The local.agent-icons plugin (~/.config/herdr/local-plugins/agent-icons)
# replaces each agent's label with a Nerd Font logo; the row below puts that
# logo on the first line in Night City yellow.
[ui.sidebar.agents]
rows = [["state_icon", { token = "agent", fg = "#FCEE0A", bold = true }, "machine", "workspace", "tab"]]

# ── Space rows: workspace in yellow, branch in cyan, then git status ────────
[ui.sidebar.spaces]
rows = [["state_icon", { token = "workspace", fg = "#FCEE0A", bold = true }], [{ token = "branch", fg = "#00F0FF" }, "git_status"]]
